apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: stockpilot-backend
  namespace: app-ns
  labels:
    release: prometheus-stack     # must match your Helm release name
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
